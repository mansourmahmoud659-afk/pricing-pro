<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>محترف التسعير Pro - لوحة الأكواد</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b0f19;
            color: #e2e8f0;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
        }

        input {
            background: #090d16;
            border: 1px solid #263244;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body style="padding:20px; max-width:900px; margin:auto;">

    <div class="card" style="padding:20px; margin-bottom:20px;">
        <h1 style="font-size:22px; font-weight:bold;">
            🔑 لوحة تحكم أكواد محترف التسعير Pro
        </h1>

        <p style="color:#94a3b8; margin-top:5px;">
            إنشاء وإدارة أكواد تفعيل الأداة
        </p>
    </div>


    <!-- إنشاء كود -->

    <div class="card" style="padding:20px; margin-bottom:20px;">

        <h2 style="font-size:18px; font-weight:bold; margin-bottom:15px;">
            ✨ إنشاء كود تفعيل
        </h2>

        <label>
            الكود المخصص
        </label>

        <input
            id="customCode"
            type="text"
            placeholder="مثال: PRO-6654-X"
            style="margin-top:8px; margin-bottom:15px;"
        >

        <button
            id="createButton"
            onclick="generateCode()"
            style="
                background:#10b981;
                color:#06120d;
                font-weight:bold;
                padding:12px 20px;
                border-radius:10px;
                border:0;
                width:100%;
            "
        >
            ✨ إنشاء وإضافة الكود
        </button>

    </div>


    <!-- النتيجة -->

    <div
        id="result"
        class="card"
        style="
            display:none;
            padding:20px;
            margin-bottom:20px;
            text-align:center;
        "
    ></div>


    <!-- الأكواد -->

    <div class="card" style="padding:20px;">

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
            margin-bottom:15px;
        ">

            <h2 style="font-size:18px; font-weight:bold;">
                📋 الأكواد
            </h2>

            <button
                onclick="loadCodes()"
                style="
                    background:#1e293b;
                    color:white;
                    border:0;
                    padding:8px 12px;
                    border-radius:8px;
                "
            >
                🔄 تحديث
            </button>

        </div>


        <div id="codesTable">
            جاري تحميل الأكواد...
        </div>

    </div>


<script>

const SUPABASE_URL =
"https://wcmiyrroskstgzwbvsor.supabase.co";

const SUPABASE_KEY =
"Sb_publishable_Hia5ResownbSTejq-DcWkA_HbZTcsZl";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ==============================
// إنشاء كود
// ==============================

async function generateCode() {

    const button =
        document.getElementById("createButton");

    const result =
        document.getElementById("result");

    const input =
        document.getElementById("customCode");


    let code =
        input.value.trim().toUpperCase();


    // لو المستخدم سايب الخانة فاضية
    // يتم إنشاء كود تلقائي

    if (!code) {

        code =
            "PRO-" +
            Math.random()
            .toString(36)
            .substring(2, 8)
            .toUpperCase();

    }


    button.disabled = true;

    button.innerText =
        "⏳ جاري إنشاء الكود...";


    try {

        const { data, error } =

            await supabaseClient

            .from("activation_codes")

            .insert({

                code: code,

                is_used: false

            })

            .select();


        if (error) {

            result.style.display = "block";

            result.innerHTML =

                `<div style="color:#f87171;font-weight:bold;">
                    ❌ لم يتم إنشاء الكود
                </div>

                <div style="margin-top:8px;color:#94a3b8;">
                    ${error.message}
                </div>`;

            return;

        }


        result.style.display = "block";

        result.innerHTML =

            `<div style="color:#34d399;font-weight:bold;font-size:18px;">
                ✅ تم إنشاء الكود بنجاح
            </div>

            <div
                style="
                    margin-top:15px;
                    font-size:25px;
                    font-weight:bold;
                    color:#34d399;
                    letter-spacing:2px;
                "
            >
                ${code}
            </div>

            <button
                onclick="copyCode('${code}')"
                style="
                    margin-top:15px;
                    background:#2563eb;
                    color:white;
                    border:0;
                    padding:10px 18px;
                    border-radius:9px;
                    font-weight:bold;
                "
            >
                📋 نسخ الكود
            </button>`;


        input.value = "";


        loadCodes();


    } catch (error) {

        result.style.display = "block";

        result.innerHTML =

            `<div style="color:#f87171;">
                ❌ حصل خطأ:
                ${error.message}
            </div>`;

    }


    button.disabled = false;

    button.innerText =
        "✨ إنشاء وإضافة الكود";

}



// ==============================
// نسخ الكود
// ==============================

function copyCode(code) {

    navigator.clipboard
        .writeText(code)

        .then(() => {

            alert("✅ تم نسخ الكود");

        })

        .catch(() => {

            alert("الكود:\n" + code);

        });

}



// ==============================
// تحميل الأكواد
// ==============================

async function loadCodes() {

    const container =
        document.getElementById("codesTable");


    container.innerHTML =
        "⏳ جاري تحميل الأكواد...";


    try {

        const { data, error } =

            await supabaseClient

            .from("activation_codes")

            .select("id, code, is_used");


        if (error) {

            container.innerHTML =

                `<div style="color:#f87171;">
                    ❌ خطأ في تحميل الأكواد
                    <br><br>
                    ${error.message}
                </div>`;

            return;

        }


        if (!data || data.length === 0) {

            container.innerHTML =

                `<div style="color:#94a3b8;text-align:center;padding:20px;">
                    لا توجد أكواد حتى الآن.
                </div>`;

            return;

        }


        let html = "";


        data.forEach(item => {


            const status =

                item.is_used

                ? `<span style="color:#f87171;">
                    🔴 مستخدم
                   </span>`

                : `<span style="color:#34d399;">
                    🟢 متاح
                   </span>`;


            html += `

                <div
                    style="
                        background:#090d16;
                        border:1px solid #1f2937;
                        padding:15px;
                        border-radius:12px;
                        margin-bottom:10px;
                    "
                >

                    <div
                        style="
                            font-size:20px;
                            font-weight:bold;
                            color:#34d399;
                            letter-spacing:1px;
                        "
                    >
                        ${item.code}
                    </div>


                    <div style="margin-top:8px;">
                        الحالة:
                        ${status}
                    </div>


                    <div style="margin-top:12px;">

                        <button
                            onclick="copyCode('${item.code}')"
                            style="
                                background:#2563eb;
                                color:white;
                                border:0;
                                padding:7px 12px;
                                border-radius:7px;
                                margin-left:5px;
                            "
                        >
                            📋 نسخ
                        </button>


                        <button
                            onclick="deleteCode('${item.id}')"
                            style="
                                background:#dc2626;
                                color:white;
                                border:0;
                                padding:7px 12px;
                                border-radius:7px;
                            "
                        >
                            🗑️ حذف
                        </button>

                    </div>

                </div>

            `;

        });


        container.innerHTML = html;


    } catch (error) {

        container.innerHTML =

            `<div style="color:#f87171;">
                ❌ ${error.message}
            </div>`;

    }

}



// ==============================
// حذف كود
// ==============================

async function deleteCode(id) {

    const confirmDelete =
        confirm("هل أنت متأكد من حذف هذا الكود؟");


    if (!confirmDelete) return;


    const { error } =

        await supabaseClient

        .from("activation_codes")

        .delete()

        .eq("id", id);


    if (error) {

        alert(
            "❌ لم يتم حذف الكود:\n" +
            error.message
        );

        return;

    }


    alert("✅ تم حذف الكود");


    loadCodes();

}



// تشغيل تحميل الأكواد عند فتح الصفحة

loadCodes();

</script>

</body>
</html>
