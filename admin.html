<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة أدمن محترف التسعير Pro - توليد الأكواد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #e2e8f0; }
        .glass-card { background-color: #111827; border: 1px solid #1f293d; border-radius: 1rem; }
        .input-box { background-color: #090d16; border: 1px solid #1e293b; color: #ffffff; }
    </style>
</head>
<body class="p-6 max-w-4xl mx-auto space-y-6">

    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
        <div>
            <h1 class="text-xl font-bold text-white">🔑 لوحة تحكم الأكواد - Admin Panel</h1>
            <p class="text-xs text-slate-400">إدارة وتوليد أكواد التفعيل لتطبيق محترف التسعير Pro</p>
        </div>
        <span class="text-xs px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full font-bold">متصل بـ Supabase</span>
    </div>

    <!-- توليد كود جديد -->
    <div class="glass-card p-6 space-y-4">
        <h3 class="text-base font-bold text-white">إنشاء كود تفعيل جديد</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="text-xs text-slate-400 block mb-1">اسم العميل (اختياري)</label>
                <input type="text" id="clientName" placeholder="مثال: متجر الأمل" class="w-full input-box px-3 py-2 rounded-xl text-sm">
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">الكود المخصص (أو اتركه فارغاً لتوليد كود تلقائي)</label>
                <input type="text" id="customCode" placeholder="مثال: PRO-9988-X" class="w-full input-box px-3 py-2 rounded-xl text-sm uppercase">
            </div>
        </div>
        <button onclick="generateCode()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-sm transition">
            ✨ إنشاء وإضافة الكود
        </button>
    </div>

    <!-- جدول الأكواد -->
    <div class="glass-card p-6 space-y-4">
        <div class="flex justify-between items-center">
            <h3 class="text-base font-bold text-white">قائمة الأكواد المتاحة والمستخدمة</h3>
            <button onclick="loadCodes()" class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg text-slate-300 hover:bg-slate-700">تحديث القائمة 🔄</button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-right text-xs">
                <thead>
                    <tr class="border-b border-slate-800 text-slate-400">
                        <th class="py-2 px-3">الكود</th>
                        <th class="py-2 px-3">اسم العميل</th>
                        <th class="py-2 px-3">الحالة</th>
                        <th class="py-2 px-3">تاريخ الإنشاء</th>
                        <th class="py-2 px-3">إجراءات</th>
                    </tr>
                </thead>
                <tbody id="codesTable">
                    <tr><td colspan="5" class="py-4 text-center text-slate-500">جاري تحميل الأكواد...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wcmiyrroskstgzwbvsor.supabase.co";
        const SUPABASE_KEY = "Sb_publishable_Hia5ResownbSTejq-DcWkA_HbZTcsZl";

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function generateCode() {
            const clientName = document.getElementById('clientName').value.trim() || 'عميل جديد';
            let code = document.getElementById('customCode').value.trim().toUpperCase();
            
            if (!code) {
                code = 'PRO-' + Math.random().toString(36).substring(2, 7).toUpperCase();
            }

            const { data, error } = await supabase
                .from('activation_codes')
                .insert([{ code: code, client_name: clientName }]);

            if (error) {
                alert('حدث خطأ أو الكود موجود مسبقاً: ' + error.message);
            } else {
                alert('تم إنشاء الكود بنجاح: ' + code);
                document.getElementById('clientName').value = '';
                document.getElementById('customCode').value = '';
                loadCodes();
            }
        }

        async function loadCodes() {
            const tbody = document.getElementById('codesTable');
            tbody.innerHTML = '<tr><td colspan="5" class="py-4 text-center text-slate-500">جاري التحميل...</td></tr>';

            const { data, error } = await supabase
                .from('activation_codes')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-red-400">خطأ في جلب البيانات: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="py-4 text-center text-slate-500">لا توجد أكواد أنشئت بعد.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr class="border-b border-slate-800/50 hover:bg-slate-800/30">
                    <td class="py-3 px-3 font-mono font-bold text-emerald-400 select-all">${item.code}</td>
                    <td class="py-3 px-3 text-slate-300">${item.client_name || '-'}</td>
                    <td class="py-3 px-3">
                        ${item.is_used 
                            ? '<span class="px-2 py-0.5 text-[10px] rounded bg-red-500/10 text-red-400 border border-red-500/20">مُستخْدَم</span>' 
                            : '<span class="px-2 py-0.5 text-[10px] rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">متاح</span>'}
                    </td>
                    <td class="py-3 px-3 text-slate-400 text-[10px]">${new Date(item.created_at).toLocaleDateString('ar-EG')}</td>
                    <td class="py-3 px-3">
                        <button onclick="deleteCode('${item.id}')" class="text-red-400 hover:text-red-300">حذف 🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteCode(id) {
            if (confirm('هل أنت تأكد من حذف هذا الكود؟')) {
                await supabase.from('activation_codes').delete().eq('id', id);
                loadCodes();
            }
        }

        loadCodes();
    </script>
</body>
</html>
